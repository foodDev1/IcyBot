<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Configure Your IcyBot!</title>
		<meta name="description" content="">
		<meta name="robots" content="noindex, nofollow">
		<link rel="stylesheet" href="./css/style.css">
	</head>

	<body>
		<header>
			<nav>
				<menu>
					<li><a href="index.html">Home</a></li>
					<li><a href="index.html">About</a></li>
					<li><a href="index.html">Contact</a></li>
				</menu>
			</nav>
		</header>

		<h1>Welcome to the IcyBot configuration page!</h1>


		<main>
			<div class="setup">
				<section>
					<h2>Basic Setup</h2>
					<label>In order to use your IcyBot, you need to give him a unique name!</label>
					<input type="text" placeholder="Enter a name for your IcyBot!">
				</section>

				<section>
					<h2>Reasoning</h2>
					<label>What is your main reason for purchasing an IcyBot?</label>

					<select>
                            <option>Fun</option>
                            <option>Assistence</option>
                            <option>Sexual purposes</option>
                            <option>Medical use</option>
                        </select>
				</section>

				<section class="sliders">
					<h2>Configuration</h2>

					<p>
						<label>How loud do you want your IcyBot to be?</label>
						<input type="range" min="0" max="100">
					</p>

					<p>
						<label>How intelligent do you want your IcyBot to be?</label>
						<input type="range" min="0" max="100">
					</p>

					<p>
						<label>How fat do you want your IcyBot to be?</label>
						<input type="range" min="0" max="100">
					</p>

					<p>
						<label>How gassy do you want your IcyBot to be?</label>
						<input type="range" min="0" max="100">
					</p>
				</section>

				<section>
					<h2>Thank you!</h2>
					<label>Thank you for purchasing and configuring your IcyBot! Please enter the following information.</label>
					<input type="tel" placeholder="Enter your phone number">
					<input type="email" placeholder="Your@Email.com">
					<input type="submit">
				</section>
			</div>

			<div class="images">
				<img src="./img/IcyBot.png" alt="IcyBot Image" class="icy-image">
				<img src="./img/Bololito.png" alt="Bololoi Image" class="bolo-image">
				<img src="./img/pear-fruit-png-11.png" alt="Pear Image">
			</div>
		</main>

		<footer>
			<p>© 1999 IcyBot Inc. All Rights Reserved.</p>
		</footer>
	</body>
</html>
